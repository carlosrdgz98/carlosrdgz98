<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Tienda de Manillas</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <main class="contenedor">

        <h1>🛍️ Tienda de Manillas</h1>

        <h2>Iniciar sesión</h2>

        <form id="formLogin">

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="correo@ejemplo.com"
                required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Tu contraseña"
                required
            >

            <button type="submit">
                🔐 Iniciar sesión
            </button>

        </form>

        <p id="mensaje"></p>

        <p>
            ¿No tienes una cuenta?
            <a href="registro.html">Crear cuenta</a>
        </p>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
